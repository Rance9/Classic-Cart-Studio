name: Website (build, scan, deploy to GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.17"   # the one build Python (tools/publish/requirements-build.txt), also the Windows release's
      - name: Install the build's exact packages (Pillow draws the original sprites)
        run: python -m pip install --quiet -r tools/publish/requirements-build.txt
      - name: The build environment is exactly the pinned one (Python and package versions)
        run: python tools/publish/check_build_env.py
      - name: Unit tests that need no game files
        run: |
          python tools/rom-pipeline/test_manifest_v4_pure.py
          python tools/publish/test_scan_prohibited.py
          python tools/publish/test_release_streams.py
          python tools/publish/test_community_showcase.py
      - name: The Installation Terms (the Help chapter, the installer's and the release's copies are the one maintained source's)
        run: python tools/publish/legal_terms.py --check
      - name: The browser game player (W1) from this commit, with the pinned zig (version, URL and SHA-256 from toolchain.lock.json; FCEUmm is vendored)
        run: python tools/publish/build_web_player.py build/web-player
      - name: Build the public website from the public data (it fails without the browser game player); --public prelaunch is the coming-soon page at / and the app at /preview/ (tools/publish/public_entry.py; --public launch at the launch)
        env:
          CCS_REQUIRE_WEB_PLAYER: "1"
        run: python tools/publish/build_site_ci.py build/site --public prelaunch
      - name: Prohibited-content scan of the site artifact (fails the build on any finding)
        run: python tools/publish/scan_prohibited.py build/site
      - name: Page checks (structure, no external assets, no private paths, sub-path safe)
        run: python tools/rom-pipeline/test_public_site.py build/site
      - name: Artwork consistency (the Game Library and Preview on TV show the same cover for every game, the 30 factory games included)
        env:
          NES_STUDIO_SITE: ${{ github.workspace }}/build/site
        run: python tools/companion/test_artwork_consistency.py --no-render
      - name: Attach the release information (release-streams.json, the four product/channel streams the update checks read; release.json and workbench-release.json, each product's newest preview, for earlier releases and the download section)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/publish/release_notes.py --include-prereleases --write-streams-json build/site/release-streams.json --write-release-json build/site/release.json --write-workbench-json build/site/workbench-release.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
