name: Classic Cart Studio for Windows (build the installer and publish a release)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-native:
    # the native HOME renderer, one C source tree (tools/console-simulator/core): the static 32-bit ARM runtime the console package
    # carries, and the Windows build that draws Preview on TV. Pinned, checksum-verified toolchain (toolchain.lock.json), no root.
    name: Build the native HOME renderer (ARM runtime, Windows preview core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (zig pinned and SHA-256 verified, qemu-user for the ARM check)
        run: bash tools/console-simulator/scripts/wsl_setup.sh
      - name: Build
        env:
          CCS_SIM_BUILD: ${{ github.workspace }}/build/native
        run: bash tools/console-simulator/scripts/wsl_build.sh "linux-x86_64 windows-x86_64 arm-musl-device"
      - name: The ARM runtime is a static 32-bit ARM executable and starts under qemu-arm
        run: |
          set -euo pipefail
          file build/native/arm-musl-device/ccs-home-armv7 | tee file.txt; grep -q "ELF 32-bit LSB executable, ARM" file.txt; grep -q "statically linked" file.txt
          echo shutdown | "$HOME/.cache/ccs-sim/toolchain/deb/usr/bin/qemu-arm" build/native/arm-musl-device/ccs-home-armv7 | tee arm.log; grep -q '"ev":"ready"' arm.log
          echo shutdown | build/native/linux-x86_64/ccs-sim-core | grep -q '"ev":"ready"'
      - uses: actions/upload-artifact@v4
        with:
          name: native-home
          path: |
            build/native/arm-musl-device/ccs-home-armv7
            build/native/arm-musl-device/build-info.json
            build/native/windows-x86_64/ccs-sim-core.exe
            build/native/windows-x86_64/build-info.json
          if-no-files-found: error

  build-windows:
    needs: build-native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-home
          path: build/native
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --quiet pillow pyinstaller==6.22.3
          choco install innosetup --no-progress -y
      - name: Version must match the tag
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          if ("${{ github.ref_name }}" -ne "v$v" -and "${{ github.event_name }}" -eq "push") { throw "tag ${{ github.ref_name }} does not match VERSION $v" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
      - name: Build the public site (shipped inside the companion)
        run: python tools/publish/build_site_ci.py build/site
      - name: Scan the site
        run: python tools/publish/scan_prohibited.py build/site
      - name: The official Hakchi2 CE 3.9.3 package with its console USB driver (downloaded, size and SHA-256 verified; bundled so setup needs no download)
        run: python tools/publish/fetch_hakchi_package.py build/packages
      - name: Freeze the companion (PyInstaller, one-folder; bundles the native HOME runtime and the preview core)
        env:
          NES_SITE_DIR: ${{ github.workspace }}\build\site
          CCS_NATIVE_HOME_RUNTIME: ${{ github.workspace }}\build\native\arm-musl-device\ccs-home-armv7
          CCS_NATIVE_PREVIEW_CORE: ${{ github.workspace }}\build\native\windows-x86_64\ccs-sim-core.exe
          CCS_REQUIRE_NATIVE: "1"
        run: python tools/publish/write_version_info.py tools/companion/version_info.txt; pyinstaller tools/companion/companion.spec --distpath build/dist --workpath build/work --noconfirm
      - name: Release layout (the native runtime and the preview core are bundled; a native HOME package is prepared from the release folder alone)
        run: python tools/companion/test_release_layout.py build/dist/ClassicCartStudioBackend
      - name: Build Classic Cart Studio for Windows (WPF + WebView2 host, .NET Framework 4.8)
        shell: pwsh
        run: |
          dotnet build tools/desktop/ClassicCartStudio/ClassicCartStudio.csproj -c Release -nologo "-p:Version=$env:APP_VERSION"
          $out = "tools/desktop/ClassicCartStudio/bin/Release/net48"
          Copy-Item "$out/ClassicCartStudio.exe", "$out/ClassicCartStudio.exe.config", "$out/Microsoft.Web.WebView2.Core.dll", "$out/Microsoft.Web.WebView2.Wpf.dll", "$out/WebView2Loader.dll" build/dist/ClassicCartStudioBackend/ -ErrorAction Stop
          Get-ChildItem build/dist/ClassicCartStudioBackend/*.exe | ForEach-Object { "$($_.Name) $($_.Length)" }
      - name: Self-test the desktop host against the frozen backend (starts it, desktop channel, stops it)
        shell: pwsh
        run: |
          $env:NES_STUDIO_DATA = Join-Path $env:RUNNER_TEMP "ccs-selftest"
          & build/dist/ClassicCartStudioBackend/ClassicCartStudio.exe --selftest | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { throw "desktop self-test failed" }
      - name: Copy the installer wizard images and the Start menu icon
        shell: pwsh
        run: |
          Copy-Item tools/publish/assets/wizard-*.bmp build/dist/ClassicCartStudioBackend/_internal/site/brand/public/
          Copy-Item tools/publish/assets/app.ico build/dist/ClassicCartStudioBackend/ClassicCartStudio.ico -ErrorAction Stop
      - name: Build the installer (Inno Setup, per-user)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$PWD\build\dist\ClassicCartStudioBackend" "/DOutDir=$PWD\build\release" tools\companion\installer.iss
      - name: Scan the release folder and the frozen tree (no game files, images or secrets may ship)
        run: |
          python tools/publish/scan_prohibited.py build/dist --allow "**/*.pyd" --allow "**/*.dll" --allow "**/*.exe" --allow "**/base_library.zip" --allow "**/*.exe.config" --allow "**/native/ccs-home-armv7" --allow "**/packages/hakchi2-ce-3.9.3-portable.zip"
          python tools/publish/scan_prohibited.py build/release --allow "*.exe"
      - name: Checksums and build information
        shell: pwsh
        run: |
          Set-Location build/release
          $f = Get-ChildItem *.exe | Select-Object -First 1
          $h = (Get-FileHash -Algorithm SHA256 $f.Name).Hash.ToLower()
          "$h  $($f.Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          @{ version = $env:APP_VERSION; installer = $f.Name; sha256 = $h; size = $f.Length; source_revision = "${{ github.sha }}"; workflow_run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; built = (Get-Date).ToUniversalTime().ToString("o"); signed = $false } | ConvertTo-Json | Out-File -Encoding utf8 build-info.json
          Get-Content SHA256SUMS.txt
      - name: Smoke-test the frozen companion (starts, answers /api/version, stops)
        shell: pwsh
        run: python tools/companion/test_frozen_smoke.py build/dist/ClassicCartStudioBackend/ClassicCartStudioBackend.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            build/release/*.exe
            build/release/SHA256SUMS.txt
            build/release/build-info.json
      - name: Attest build provenance (GitHub artifact attestations)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/release/*.exe
      - name: Publish the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python tools/publish/release_notes.py --version $env:APP_VERSION --build-info build/release/build-info.json --out build/release/NOTES.md
          gh release create "${{ github.ref_name }}" build/release/*.exe build/release/SHA256SUMS.txt build/release/build-info.json --title "Classic Cart Studio $env:APP_VERSION" --notes-file build/release/NOTES.md
